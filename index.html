<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Traffic Monitor</title>
    <style>
        /* GitHub Raw 스타일 디자인 */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
            padding: 16px;
            overflow-x: hidden;
        }

        #raw-output {
            white-space: pre-wrap;
            word-break: break-all;
            display: block;
            margin-bottom: 20px;
        }

        .chart-container {
            width: 100%;
            max-width: 900px;
            margin-top: 10px;
            position: relative;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            color: #8b949e;
            font-size: 13px;
        }

        .btn-reset {
            background-color: #21262d;
            color: #f85149;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-reset:hover {
            background-color: #30363d;
        }

        canvas {
            display: block;
            width: 100%;
            height: 220px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .chart-legend {
            margin-top: 8px;
            font-size: 12px;
            color: #8b949e;
            display: flex;
            gap: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 12px;
            height: 3px;
            display: inline-block;
            border-radius: 2px;
        }

        ::selection {
            background-color: #1f6feb;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <span id="raw-output">트래픽 데이터를 불러오는 중...</span>

    <div class="chart-container">
        <div class="chart-header">
            <span>[실시간 초당 트래픽 히스토리 - 드래그하여 과거 기록 탐색]</span>
            <button class="btn-reset" onclick="resetHistory()">기록 초기화</button>
        </div>
        <canvas id="trafficChart"></canvas>
        <div class="chart-legend">
            <div class="legend-item">
                <span class="legend-color" style="background-color: #58a6ff;"></span>
                <span>RPS (요청/초)</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background-color: #3fb950;"></span>
                <span>네트워크 처리량 (Mbps)</span>
            </div>
        </div>
    </div>

<script>
    let requestsInCurrentSecond = 0;
    let currentRps = 0;
    let simulatedMbps = 0;

    const MAX_HISTORY = 500; // 최대 500초 데이터 보존
    let rpsHistory = [];
    let mbpsHistory = [];

    // 1. 로컬 저장소(localStorage)에서 기존 데이터 불러오기
    function loadSavedData() {
        try {
            const savedRps = localStorage.getItem('raw_traffic_rps');
            const savedMbps = localStorage.getItem('raw_traffic_mbps');
            if (savedRps && savedMbps) {
                rpsHistory = JSON.parse(savedRps);
                mbpsHistory = JSON.parse(savedMbps);
            }
        } catch (e) {
            console.error("데이터 로드 실패", e);
        }

        // 데이터가 없거나 모자란 경우 초기화
        while (rpsHistory.length < 60) rpsHistory.push(0);
        while (mbpsHistory.length < 60) mbpsHistory.push(0);
    }

    // 데이터 저장 함수
    function saveData() {
        try {
            localStorage.setItem('raw_traffic_rps', JSON.stringify(rpsHistory));
            localStorage.setItem('raw_traffic_mbps', JSON.stringify(mbpsHistory));
        } catch (e) {}
    }

    // 기록 초기화 기능
    function resetHistory() {
        if (confirm("모든 트래픽 히스토리 기록을 삭제하시겠습니까?")) {
            localStorage.removeItem('raw_traffic_rps');
            localStorage.removeItem('raw_traffic_mbps');
            rpsHistory = new Array(60).fill(0);
            mbpsHistory = new Array(60).fill(0);
            viewOffset = 0;
            drawChart();
        }
    }

    function trackRequest() {
        requestsInCurrentSecond++;
    }

    loadSavedData();

    // Canvas 및 드래그(Pan) 변수
    const canvas = document.getElementById('trafficChart');
    const ctx = canvas.getContext('2d');
    
    let isDragging = false;
    let startX = 0;
    let viewOffset = 0; // 드래그 오프셋 (과거 기록 탐색용)

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', () => {
        resizeCanvas();
        drawChart();
    });

    // 드래그 이벤트 등록
    canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - startX;
        startX = e.clientX;

        // 드래그 이동 거리 조절
        viewOffset += Math.round(deltaX / 10);
        
        // 탐색 범위 제한 (최신 위치 ~ 과거 끝)
        const maxOffset = Math.max(0, rpsHistory.length - 60);
        if (viewOffset < 0) viewOffset = 0;
        if (viewOffset > maxOffset) viewOffset = maxOffset;

        drawChart();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // 그래프 그리기 함수
    function drawChart() {
        const rect = canvas.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        ctx.clearRect(0, 0, width, height);

        // 화면에 보여줄 60개의 데이터 슬라이싱 (드래그 오프셋 적용)
        const totalPoints = rpsHistory.length;
        const endIndex = totalPoints - viewOffset;
        const startIndex = Math.max(0, endIndex - 60);

        const currentRpsSlice = rpsHistory.slice(startIndex, endIndex);
        const currentMbpsSlice = mbpsHistory.slice(startIndex, endIndex);

        const maxVal = Math.max(10, ...currentRpsSlice, ...currentMbpsSlice) * 1.2;
        const padding = { top: 20, right: 15, bottom: 25, left: 40 };
        const graphWidth = width - padding.left - padding.right;
        const graphHeight = height - padding.top - padding.bottom;

        // 배경 그리드
        ctx.strokeStyle = '#21262d';
        ctx.lineWidth = 1;
        ctx.font = '10px monospace';
        ctx.fillStyle = '#484f58';

        for (let i = 0; i <= 4; i++) {
            const y = padding.top + (graphHeight / 4) * i;
            const val = Math.round(maxVal - (maxVal / 4) * i);
            ctx.beginPath();
            ctx.moveTo(padding.left, y);
            ctx.lineTo(width - padding.right, y);
            ctx.stroke();
            ctx.fillText(val.toString(), 8, y + 3);
        }

        // 라인 그리기
        function drawSeries(data, lineColor, fillColor) {
            if (data.length < 2) return;
            const stepX = graphWidth / 59;

            ctx.beginPath();
            for (let i = 0; i < data.length; i++) {
                const x = padding.left + i * stepX;
                const normalizedY = (data[i] / maxVal);
                const y = padding.top + graphHeight * (1 - normalizedY);

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }

            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            const lastX = padding.left + (data.length - 1) * stepX;
            const bottomY = padding.top + graphHeight;
            ctx.lineTo(lastX, bottomY);
            ctx.lineTo(padding.left, bottomY);
            ctx.closePath();

            const gradient = ctx.createLinearGradient(0, padding.top, 0, bottomY);
            gradient.addColorStop(0, fillColor);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        drawSeries(currentMbpsSlice, '#3fb950', 'rgba(63, 185, 80, 0.15)');
        drawSeries(currentRpsSlice, '#58a6ff', 'rgba(88, 166, 255, 0.2)');

        // 과거 데이터 보는 중 알림 표시
        if (viewOffset > 0) {
            ctx.fillStyle = '#e3b341';
            ctx.font = '12px monospace';
            ctx.fillText(`[과거 기록 탐색 중: -${viewOffset}초 (클릭 시 복귀)]`, width - 230, 15);
        }
    }

    // past 라벨 클릭 시 최신으로 복귀
    canvas.addEventListener('click', () => {
        if (viewOffset > 0) {
            viewOffset = 0;
            drawChart();
        }
    });

    // 초당 주기적 갱신 (1초)
    setInterval(() => {
        currentRps = requestsInCurrentSecond;
        requestsInCurrentSecond = 0;

        // 실제 연동 수치 또는 임의 계산
        simulatedMbps = parseFloat((currentRps * 0.1).toFixed(2));

        rpsHistory.push(currentRps);
        mbpsHistory.push(simulatedMbps);

        if (rpsHistory.length > MAX_HISTORY) rpsHistory.shift();
        if (mbpsHistory.length > MAX_HISTORY) mbpsHistory.shift();

        saveData(); // 로컬 저장소 저장

        const timestamp = new Date().toISOString();
        const rawText = `[${timestamp}] 트래픽 상태: 온라인
--------------------------------------------------
현재 RPS(요청/초): ${currentRps} 요청/초
네트워크 처리량: ${simulatedMbps}Mbps
상태: 정상`;

        document.getElementById('raw-output').textContent = rawText;

        resizeCanvas();
        drawChart();
    }, 1000);

</script>
</body>
</html>
